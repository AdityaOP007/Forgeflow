name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  validate:
    name: Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: forgeflow
          POSTGRES_PASSWORD: forgeflow_password
          POSTGRES_DB: forgeflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 4000
      NODE_ENV: test
      DATABASE_URL: postgresql://forgeflow:forgeflow_password@localhost:5432/forgeflow_test
      TEST_DATABASE_URL: postgresql://forgeflow:forgeflow_password@localhost:5432/forgeflow_test
      WEB_ORIGIN: http://localhost:5173
      LOCAL_USER_EMAIL: admin@forgeflow.local

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://forgeflow:forgeflow_password@localhost:5432/forgeflow_test

      - name: Run tests
        run: pnpm test

      - name: Run build
        run: pnpm build

  template-smoke:
    name: FastAPI Template Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify FastAPI template
        run: pnpm --filter @forgeflow/api verify:template
