apiVersion: v1
kind: Namespace
metadata:
  name: forgeflow-dev
  labels:
    app.kubernetes.io/managed-by: forgeflow
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgeflow-worker
  namespace: forgeflow-dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgeflow-worker-role
  namespace: forgeflow-dev
rules:
  - apiGroups: ['apps']
    resources: ['deployments', 'statefulsets', 'replicasets']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['']
    resources: ['services', 'secrets', 'configmaps', 'persistentvolumeclaims', 'serviceaccounts']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['']
    resources: ['pods', 'events']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgeflow-worker-binding
  namespace: forgeflow-dev
subjects:
  - kind: ServiceAccount
    name: forgeflow-worker
    namespace: forgeflow-dev
roleRef:
  kind: Role
  name: forgeflow-worker-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: forgeflow-worker-token
  namespace: forgeflow-dev
  annotations:
    kubernetes.io/service-account.name: forgeflow-worker
type: kubernetes.io/service-account-token
