{{- $nodePort := required "nodePort is required" .Values.nodePort -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "service-chart.name" . }}
  labels:
    {{- include "service-chart.labels" . | nindent 4 }}
spec:
  type: NodePort
  selector:
    {{- include "service-chart.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: http
      nodePort: {{ $nodePort }}
      protocol: TCP

